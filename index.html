<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芭梨氏家 - 每日點餐計數與營收統計</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f9f8f3;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #5c3d2e;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7a9a60;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .item-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info {
            flex-grow: 1;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #4a6b32;
        }
        .item-price {
            font-size: 14px;
            color: #888;
        }
        .count-display {
            font-size: 16px;
            margin-top: 4px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-add {
            background-color: #7a9a60;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-add:active {
            background-color: #5d7847;
        }
        .btn-sub {
            background-color: #e0e0e0;
            color: #666;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-sub:active {
            background-color: #cccccc;
        }
        .summary-card {
            background: #5c3d2e;
            color: white;
            border-radius: 12px;
            padding: 18px 15px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .summary-row {
            margin: 8px 0;
        }
        .summary-title {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 2px;
        }
        .summary-value {
            font-size: 24px;
            font-weight: bold;
        }
        .summary-divider {
            border-top: 1px dashed rgba(255,255,255,0.3);
            margin: 12px 0;
        }
    </style>
</head>
<body>

    <h1>芭梨氏家</h1>
    <div class="subtitle">每日點餐計數與營收統計</div>

    <!-- 1. 原味 -->
    <div class="item-card" data-price="50">
        <div class="item-info">
            <div class="item-name">原味</div>
            <div class="item-price">新台幣 50 元</div>
            <div class="count-display">已點：<span class="count">0</span> 份</div>
        </div>
        <div class="btn-group">
            <button class="btn-sub" onclick="changeCount(this, -1)">-</button>
            <button class="btn-add" onclick="changeCount(this, 1)">+</button>
        </div>
    </div>

    <!-- 2. 甘草 -->
    <div class="item-card" data-price="50">
        <div class="item-info">
            <div class="item-name">甘草</div>
            <div class="item-price">新台幣 50 元</div>
            <div class="count-display">已點：<span class="count">0</span> 份</div>
        </div>
        <div class="btn-group">
            <button class="btn-sub" onclick="changeCount(this, -1)">-</button>
            <button class="btn-add" onclick="changeCount(this, 1)">+</button>
        </div>
    </div>

    <!-- 3. 梅子 -->
    <div class="item-card" data-price="50">
        <div class="item-info">
            <div class="item-name">梅子</div>
            <div class="item-price">新台幣 50 元</div>
            <div class="count-display">已點：<span class="count">0</span> 份</div>
        </div>
        <div class="btn-group">
            <button class="btn-sub" onclick="changeCount(this, -1)">-</button>
            <button class="btn-add" onclick="changeCount(this, 1)">+</button>
        </div>
    </div>

    <!-- 4. 綜合 -->
    <div class="item-card" data-price="50">
        <div class="item-info">
            <div class="item-name">綜合</div>
            <div class="item-price">新台幣 50 元</div>
            <div class="count-display">已點：<span class="count">0</span> 份</div>
        </div>
        <div class="btn-group">
            <button class="btn-sub" onclick="changeCount(this, -1)">-</button>
            <button class="btn-add" onclick="changeCount(this, 1)">+</button>
        </div>
    </div>

    <!-- 總統計區塊 -->
    <div class="summary-card">
        <div class="summary-row">
            <div class="summary-title">今日銷售總份數</div>
            <div class="summary-value"><span id="total-count">0</span> 份</div>
        </div>
        
        <div class="summary-divider"></div>
        
        <div class="summary-row">
            <div class="summary-title">今日預估總營收</div>
            <div class="summary-value">NT$ <span id="total-revenue">0</span></div>
        </div>
    </div>

    <script>
        function changeCount(button, amount) {
            const card = button.closest('.item-card');
            const countSpan = card.querySelector('.count');
            
            let currentCount = parseInt(countSpan.textContent);
            let newCount = currentCount + amount;
            
            if (newCount < 0) newCount = 0;
            
            countSpan.textContent = newCount;
            updateTotals();
        }

        function updateTotals() {
            let totalRevenue = 0;
            let totalCount = 0;
            const cards = document.querySelectorAll('.item-card');
            
            cards.forEach(card => {
                const price = parseInt(card.getAttribute('data-price'));
                const count = parseInt(card.querySelector('.count').textContent);
                
                totalCount += count;
                totalRevenue += price * count;
            });
            
            // 更新畫面資料
            document.getElementById('total-count').textContent = totalCount;
            document.getElementById('total-revenue').textContent = totalRevenue.toLocaleString();
        }
    </script>

</body>
</html>
